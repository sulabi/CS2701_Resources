<!DOCTYPE html>
<html lang="en">

<head>
    <title>
        Fresh Food For All
    </title>
    <link rel="stylesheet" href="CS2701-Week4-Registration.css">
</head>

<body>
    <header></header>
    <nav>
        <ul class="navlist">
            <li><a href="/">Home</a></li>
            <li><a href="/register">Register</a></li>
            <li><a href="/login">Login</a></li>
            <li><a href="/help">Help</a></li>
        </ul>
    </nav>
    <main>
        <!-- Check Week 4 Lecture to learn about HTML5 semantic elements-->
        <aside>
        <input type="search" id="search" placeholder="Search">
        </aside>
        <section>
            <form class="center" novalidate>
                <!-- ToDo: Implement the form containing 
                           Name - type text
                           email- type text
                           password - type text
                           Terms of Service - type checkbox
                           Register - button
                           Learn more - link
                           Check lecture slides and the links on the slides to learn about forms
                           and how to create a button that would react to a click Event
                        -->
                <!-- Example given for user type checkboxes-->

                <label for="name">Name:</label>
                <br>
                <input type="text" id="name" name="Name" value="" required>
                <br><br>

                <label for="email">Email:</label>
                <br>
                <input type="email" id="email" name="Email" required>
                <br><br>

                <label for="password">Password:</label>
                <br>
                <input type="password" id="password" name="Password" required>
                <br><br>

                <label for="confirm-password">Re-type Password:</label>
                <br>
                <input type="password" id="confirm-password" name="Re-type Password" required>
                <br><br>



                <input type="checkbox" id="buyer" name="buyer" value="buyer">
                <label for="buyer">I want to buy produce directly from allotment owners.</label><br>
                <input type="checkbox" id="seller" name="seller" value="seller">
                <label for="seller">I want to sell produce from my allotment.</label><br><br>

                <br>

                <input type="checkbox" id="agree" name="agree" value="agreed">
                <label for="agree">I agree to the <a href="example.com">Terms of Use</a> and <a
                        href="example.com">Privacy Policy</a></label>
                <br>
                <button>Register</button>
                <a href="example.com">Learn More</a>
            </form>
            <div class="center" id="hiddenSection">
                <p id="hiddenParagraph"></p>
            </div>
        </section>
    </main>
</body>

</html>
